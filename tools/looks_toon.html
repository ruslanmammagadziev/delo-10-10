<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>looks_toon</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head><body>
<!-- Ролики экрана выбора образа: 3D-героиня игры в каждом из шести образов на мультяшном фоне.
     Страницу открывает tools/looks_toon.js (Playwright): ?look=<id>&ss=<суперсэмплинг>&frames=<кадров>.
     Героиня собрана как в игре (js/world/actors.js buildHeroRig): та же сетка, toon-материал с мягкой рампой,
     контур-оболочка, контровой свет набора WORLD.createKit, образ — HeroOutfits.set, поза — HeroAnim. -->
<script src="../js/vendor/three.min.js"></script>
<script src="../js/vendor/GLTFLoader.js"></script>
<script src="../js/hero_looks.js"></script>
<script src="../js/hero3d.js"></script>
<script src="../js/hero_look3d.js"></script>
<script src="../js/hero_zones.js"></script>
<script src="../js/hero_outfits.js"></script>
<script src="../js/hero_anim.js"></script>
<script src="../js/world/kit.js"></script>
<script>
/* =====================================================================
   РЕНДЕР РОЛИКОВ ОБРАЗОВ (вместо фотороликов). Один кадр — window.TOON.frame(i): шаг анимации, кадр, пиксели RGBA
   (base64, снизу вверх — как отдаёт readPixels). Кадров N (24 к/с × 6 с = 144), петля бесшовная:
     · камера: облёт вокруг героини (рыскание ±A°) и лёгкий наезд — функции кадра i с периодом N;
     · HeroAnim: шаг dt = PERIOD / N (PERIOD = 2 вдоха по 3,8 с = 7,6 с анимации на 6 с ролика), переминание
       с ноги на ногу и «взгляд» в HeroAnim выбираются через Math.random — на время шага он подменён сценарием:
       смена опорной ноги ровно каждые N/2 шагов (−1, +1), взгляд — прямо (голова следит за камерой здесь, накладкой);
     · прогрев WARM периодов без кадров: пружины волос и пол, сглаживания HeroAnim успевают выйти на период;
     · TOON.seam() после последнего кадра — шаг N (≡ кадр 0): расхождение костей с кадром 0 (должно быть ≈ 0).
   Фоны — простые низкополигональные сцены в палитре игры (toon и рампа набора WORLD.createKit), без надписей,
   людей, вывесок и номеров; фон чуть мягче и бледнее героини (дымка Fog начинается за ней).
   ===================================================================== */
(async function () {
  'use strict';
  const T = THREE, Q = new URLSearchParams(location.search), PI = Math.PI, D2R = PI / 180;
  const LOOK = Q.get('look') || 'suede';
  const SS = +(Q.get('ss') || 2), OW = 600, OH = 900, W = OW * SS, H = OH * SS;
  const N = +(Q.get('frames') || 144), PERIOD = 7.6, DT = PERIOD / N, WARM = 3;
  const info = { look: LOOK, w: W, h: H, frames: N };
  const fail = e => { console.error(e); window.TOON = { error: String(e && e.stack || e) }; document.title = 'FAIL'; };
  try {
    if (!window.HeroLooks || !HeroLooks.valid(LOOK)) throw new Error('неизвестный образ ' + LOOK);
    const r = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: false });
    r.setPixelRatio(1); r.setSize(W, H);
    r.shadowMap.enabled = true; r.shadowMap.type = T.PCFShadowMap;
    document.body.appendChild(r.domElement);
    const H3 = await HERO3D.load();
    if (!H3) throw new Error('HERO3D.load: нет модели');
    const SC = SCENES[LOOK];
    const scene = new T.Scene();
    const L = SC.light;
    const K = WORLD.createKit({ rim: L.rim });
    scene.background = new T.Color(L.fog[0]);
    scene.fog = new T.Fog(new T.Color(L.fog[0]), L.fog[1], L.fog[2]);
    const hemi = new T.HemisphereLight(L.hemi[0], L.hemi[1], L.hemi[2]); scene.add(hemi);
    const sun = new T.DirectionalLight(L.sun[0], L.sun[1]);
    const sd = new T.Vector3().fromArray(L.sun[2]).normalize();
    sun.position.copy(sd).multiplyScalar(16); sun.target.position.set(0, 0, 0);
    sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = L.shR || 4;
    Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 2, far: 40 });
    sun.shadow.camera.updateProjectionMatrix(); sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
    scene.add(sun); scene.add(sun.target);
    (L.extra || []).forEach(x => scene.add(x(T)));
    // героиня — отдельным проходом со своим светом: нейтральный ключ (белое читается белым, слоновая кость — слоновой
    // костью), тёплым остаётся только фон; направление ключа — как у солнца сцены (тень и свет на ней согласованы)
    const HL_ = Object.assign({ hemi: ['#F3F1F5', '#DED8D2', 0.6], key: ['#FFFAF4', 0.48] }, SC.hero || {});
    const heroScene = new T.Scene();
    heroScene.add(new T.HemisphereLight(HL_.hemi[0], HL_.hemi[1], HL_.hemi[2]));
    const key = new T.DirectionalLight(HL_.key[0], HL_.key[1]); key.position.copy(sd).multiplyScalar(16); heroScene.add(key); heroScene.add(key.target);

    /* ---------- фон ---------- */
    const bg = new T.Group(); scene.add(bg);
    const B = builder(T, K, bg);
    SC.build(B);
    bg.traverse(m => { if (m.isMesh) { m.castShadow = !!m.userData.cast; if (m.userData.noRecv) m.receiveShadow = false; } });

    /* ---------- героиня: копия buildHeroRig (js/world/actors.js) ---------- */
    const GV3 = [150, 150, 152, 156, 172, 190, 200, 206, 214, 228, 240, 246, 255, 255, 255, 255];
    const d3 = new Uint8Array(64); GV3.forEach((v, i) => d3.set([v, v, v, 255], i * 4));
    const GRAD3 = new T.DataTexture(d3, 16, 1, T.RGBAFormat); GRAD3.minFilter = GRAD3.magFilter = T.LinearFilter; GRAD3.generateMipmaps = false; GRAD3.needsUpdate = true;
    H3.map.encoding = T.LinearEncoding; H3.map.anisotropy = 4; H3.map.needsUpdate = true;
    const mat = new T.MeshToonMaterial({ map: H3.map, color: 0xFFFFFF, gradientMap: GRAD3 });
    const RB = H3.rig.bones, bones = RB.map(b => { const o = new T.Bone(); o.name = b[0]; return o; });
    RB.forEach((b, i) => { const p = b[1] >= 0 ? RB[b[1]][2] : [0, 0, 0]; bones[i].position.set(b[2][0] - p[0], b[2][1] - p[1], b[2][2] - p[2]); if (b[1] >= 0) bones[b[1]].add(bones[i]); });
    const root = new T.Group(), body = new T.Group(); root.add(body); heroScene.add(root);
    const mesh = new T.SkinnedMesh(H3.geometry, mat); mesh.frustumCulled = false; mesh.castShadow = false; mesh.receiveShadow = false;
    RB.forEach((b, i) => { if (b[1] < 0) mesh.add(bones[i]); });
    body.add(mesh); root.updateMatrixWorld(true);
    const skeleton = new T.Skeleton(bones); mesh.bind(skeleton);
    // HeroAnim: Math.random на время create/update — сценарий (см. шапку): очередь значений, иначе 0.1 («взгляд прямо»)
    const rq = [], R0 = Math.random, RND = () => (rq.length ? rq.shift() : 0.1);
    const TIMER = (N / 2 - 0.5) * DT;   // таймер переминания: срабатывает ровно на N/2-м шаге (полшага запаса на округление)
    let wsM = 0, wsK = 0;
    rq.push((TIMER - 2) / 3); wsM = 2 + rq[0] * 3;   // как в HeroAnim.create: wsT = 2 + random * 3
    Math.random = RND;
    let anim;
    try { anim = HeroAnim.create(mesh); } finally { Math.random = R0; }
    rq.length = 0;
    if (!anim) throw new Error('HeroAnim.create: нет костей');
    (function olN(g) {
      if (g.userData.olNormal) return;
      const p = g.attributes.position, n = g.attributes.normal, map = new Map(), acc = [], ids = new Int32Array(p.count);
      for (let i = 0; i < p.count; i++) { const k = Math.round(p.getX(i) * 2e3) + ',' + Math.round(p.getY(i) * 2e3) + ',' + Math.round(p.getZ(i) * 2e3); let id = map.get(k); if (id === undefined) { id = acc.length / 3; map.set(k, id); acc.push(0, 0, 0); } ids[i] = id; acc[id * 3] += n.getX(i); acc[id * 3 + 1] += n.getY(i); acc[id * 3 + 2] += n.getZ(i); }
      const out = new Float32Array(p.count * 3);
      for (let i = 0; i < p.count; i++) { const j = ids[i] * 3, l = Math.hypot(acc[j], acc[j + 1], acc[j + 2]) || 1; out[i * 3] = acc[j] / l; out[i * 3 + 1] = acc[j + 1] / l; out[i * 3 + 2] = acc[j + 2] / l; }
      g.setAttribute('olNormal', new T.BufferAttribute(out, 3)); g.userData.olNormal = true;
    })(H3.geometry);
    const olMat = new T.ShaderMaterial({
      uniforms: { thick: { value: 0.00085 }, col: { value: new T.Color('#4A3A48') } },
      vertexShader: '#include <common>\n#include <skinning_pars_vertex>\nuniform float thick;\nattribute vec3 olNormal;\nvoid main(){\n vec3 objectNormal = olNormal;\n#include <skinbase_vertex>\n#include <skinnormal_vertex>\n vec3 transformed = vec3(position);\n#include <skinning_vertex>\n vec4 mv = modelViewMatrix * vec4(transformed, 1.0); vec3 nn = normalize(normalMatrix * objectNormal); mv.xyz += nn * thick * (-mv.z); gl_Position = projectionMatrix * mv; }',
      fragmentShader: 'uniform vec3 col; void main(){ gl_FragColor = vec4(col, 1.0); }', side: T.BackSide,
    });
    const outline = new T.SkinnedMesh(H3.geometry, olMat); outline.frustumCulled = false; outline.castShadow = false; outline.receiveShadow = false;
    body.add(outline); outline.bind(skeleton, mesh.bindMatrix);
    const A = (window.HERO3D && HERO3D.anchors) || {};
    const head = new T.Group(); head.position.set(0, (A.head || [0, 1.5])[1] - 1.335, (A.head || [0, 0, -0.09])[2] + 0.012); anim.bones.head.add(head);
    const beret = new T.Group(); beret.position.set(0, 0.235, -0.02); head.add(beret);
    const hero = { root, body, head, beret, rig: { anim, mesh, outline, skeleton }, mats: [mat] };
    const res = HeroOutfits.set(H3, hero, LOOK);
    info.outfit = res;
    if (!res || !res.ok) throw new Error('HeroOutfits.set ' + LOOK + ': ' + JSON.stringify(res));
    // контровой свет — на все toon-материалы героини после образа (как js/world/main.js)
    { const seen = new Set(); root.traverse(m => { if (m.isMesh && m.material && m.material.isMeshToonMaterial && !seen.has(m.material)) { seen.add(m.material); K.addRim(m.material, 1); tone(m.material); } }); }
    // тень — от простой «куклы» (как в городе), плюс мягкое пятно под ногами
    {
      const inv = new T.MeshBasicMaterial({ colorWrite: false, depthWrite: false });
      [[K.GEO.cone, [0, 0.82, 0], [0.36, 1.0, 0.3]], [K.GEO.sph, [0, 1.5, -0.05], [0.33, 0.36, 0.31]], [K.GEO.sph, [0, 1.82, -0.02], [0.3, 0.09, 0.3]], [K.GEO.cyl, [0, 0.2, 0], [0.11, 0.4, 0.06]]]
        .forEach(([g, p, s]) => { const m = new T.Mesh(g, inv); m.position.fromArray(p); m.scale.fromArray(s); m.castShadow = true; m.receiveShadow = false; m.renderOrder = -1; scene.add(m); });
      const blob = new T.Mesh(K.GEO.plane, K.blobMat); blob.rotation.x = -PI / 2; blob.position.set(0, 0.004, 0.02);
      blob.scale.set(0.95, 0.62, 1); blob.material.opacity = L.blob == null ? 1 : L.blob; blob.renderOrder = 1; scene.add(blob);
    }

    /* ---------- камера: облёт с периодом N ---------- */
    const C = Object.assign({ d: 5.2, fov: 27, cy: 1.05, ty: 0.973, A: 12, A0: 0, dolly: 0.02, head: 0.4 }, SC.cam || {});
    const cam = new T.PerspectiveCamera(C.fov, W / H, 0.1, 400);
    const ph = i => 2 * PI * (((i % N) + N) % N) / N;
    const yaw = i => (C.A0 + C.A * Math.sin(ph(i))) * D2R;
    function place(i) {
      const th = yaw(i), d = C.d * (1 + C.dolly * Math.cos(ph(i)));
      cam.position.set(d * Math.sin(th), C.cy, d * Math.cos(th));
      cam.lookAt(0, C.ty, 0);
    }

    /* ---------- шаг анимации ---------- */
    const S = { speed: 0, idle: true }, OS = {};
    const B_ = anim.bones;
    function step(i) {
      // переминание: зеркалим таймер HeroAnim (те же операции с плавающей точкой) и кладём в очередь выбор и новый таймер
      wsM -= DT;
      if (wsM <= 0) { wsK++; const rc = wsK % 2 ? 0.1 : 0.9, rt = (TIMER - 3.5) / 3.5; rq.push(rc, rt); wsM = 3.5 + rt * 3.5; }
      Math.random = RND;
      try { anim.update(DT, S); } finally { Math.random = R0; }
      rq.length = 0;
      HeroOutfits.update(hero, DT, OS);
      // голова чуть следит за камерой (накладка поверх позы HeroAnim; волосы — как HeroAnim: 45 % поворота головы и шеи)
      const hy = yaw(i) * C.head;
      B_.head.rotation.y += hy * 0.8; B_.neck.rotation.y += hy * 0.2; B_.hair.rotation.y += hy * 0.45;
      if (SC.tick) SC.tick(ph(i), B);
      root.updateMatrixWorld(true);
    }
    const snap = () => bones.map(b => b.quaternion.toArray().concat(b.position.toArray()));
    // прогрев: WARM периодов, кадр 0 = шаг WARM·N
    let k = 0;
    for (; k < WARM * N; k++) step(k);
    r.autoClear = false; r.info.autoReset = false;   // два прохода: счётчики вызовов — за кадр целиком
    place(0); r.compile(scene, cam); r.compile(heroScene, cam);
    const gl = r.getContext(), buf = new Uint8Array(W * H * 4);
    let snap0 = null, next = 0;
    function b64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
    window.TOON = {
      info,
      // кадр i (строго по порядку 0..N−1); read=false — только шаг (для --still)
      frame(i, read = true) {
        if (i !== next) throw new Error('кадры по порядку: ждали ' + next + ', пришёл ' + i);
        next++;
        step(i);
        if (i === 0) snap0 = snap();
        if (!read) return null;
        place(i); r.info.reset(); r.clear(); r.render(scene, cam); r.render(heroScene, cam);
        gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf);
        return b64(buf);
      },
      // шаг N (≡ кадр 0 следующего круга): максимум расхождения костей с кадром 0
      seam() {
        step(N); const a = snap(); let m = 0;
        a.forEach((v, j) => v.forEach((x, q) => { m = Math.max(m, Math.abs(x - snap0[j][q])); }));
        return m;
      },
      stats: () => ({ calls: r.info.render.calls, tris: r.info.render.triangles }),
    };
    document.title = 'OK';
  } catch (e) { fail(e); }

  // тон одежды при нейтральном ключе: js/hero_outfits.js делит тёмные и средние цвета роликов на LITC (тёплый свет
  // города вернёт их обратно), светлые оставляет как есть. Под нейтральным ключом возвращаем это умножение в шейдере
  // (те же LITC и тот же порог по яркости): средние тона — как в роликах, белое — белое, без тёплого налёта
  function tone(mat) {
    const own = n => (Object.prototype.hasOwnProperty.call(mat, n) ? mat[n] : null);
    const prev = own('onBeforeCompile'), prevKey = own('customProgramCacheKey');
    mat.onBeforeCompile = (sh, rr) => {
      if (prev) prev.call(mat, sh, rr);
      sh.fragmentShader = sh.fragmentShader.replace('#include <color_fragment>', '#include <color_fragment>\n{ float luT = dot(diffuseColor.rgb, vec3(0.299, 0.587, 0.114)); diffuseColor.rgb *= mix(vec3(1.22, 1.045, 0.965), vec3(1.0), 0.9 * smoothstep(0.588, 0.922, luT)); }');
    };
    mat.customProgramCacheKey = () => 'tone1' + (prevKey ? prevKey.call(mat) : '');
    mat.needsUpdate = true;
    return mat;
  }

  /* =====================================================================
     НАБОР СТРОИТЕЛЯ ФОНА
     ===================================================================== */
  function builder(T, K, g) {
    const MC = new Map();
    const hx = c => new T.Color(c);
    // toon-материал набора (рампа GRAD — та же, что у города); кэш по цвету и опциям
    const M = (c, x) => { const k = c + (x ? JSON.stringify(Object.keys(x).map(n => [n, x[n] && x[n].isTexture ? x[n].uuid : String(x[n])])) : ''); if (!MC.has(k)) MC.set(k, K.toon(c, x || {})); return MC.get(k); };
    const cnv = (w, h) => { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return [cv, cv.getContext('2d')]; };
    const tex = (cv, rx, ry) => { const t = new T.CanvasTexture(cv); t.anisotropy = 8; if (rx) { t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(rx, ry || rx); } return t; };
    const box = (m, x, y, z, w, h, d, o) => { const b = K.put(g, K.GEO.box, m, [x, y, z], [w, h, d], o && o.r); if (o && o.cast) b.userData.cast = 1; return b; };
    const rbox = (m, x, y, z, w, h, d, rr, o) => { const b = K.put(g, K.rboxGeo(w, h, d, rr || 0.04), m, [x, y, z], null, o && o.r); if (o && o.cast) b.userData.cast = 1; return b; };
    const sph = (m, x, y, z, sx, sy, sz, par) => K.put(par || g, K.GEO_HI.sph, m, [x, y, z], [sx, sy === undefined ? sx : sy, sz === undefined ? sx : sz]);
    const cyl = (m, x, y, z, rad, h, rot, par) => K.put(par || g, K.GEO_HI.cyl, m, [x, y, z], [rad, h, rad], rot);
    const put = (geo, m, p, s, rot, par) => K.put(par || g, geo, m, p, s, rot);
    const rng = K.rng;
    const lerpC = (a, b, t) => hx(a).lerp(hx(b), t);
    // цвет по ключам [[x, '#hex'], ...]
    const ramp = (st, x) => { if (x <= st[0][0]) return hx(st[0][1]); for (let i = 1; i < st.length; i++) if (x <= st[i][0]) return lerpC(st[i - 1][1], st[i][1], (x - st[i - 1][0]) / (st[i][0] - st[i - 1][0])); return hx(st[st.length - 1][1]); };
    // земля: плоскость с рисованной текстурой (рисунок draw(c, s) на холсте s×s, повтор rep раз на 400 м)
    function ground(col, draw, rep, o) {
      let m;
      if (draw) { const [cv, c] = cnv(512, 512); c.fillStyle = col; c.fillRect(0, 0, 512, 512); draw(c, 512); m = K.toon('#FFFFFF', { map: tex(cv, rep, rep) }); }
      else m = M(col);
      const pl = new T.Mesh(new T.PlaneGeometry((o && o.w) || 400, (o && o.d) || 400), m);
      pl.rotation.x = -PI / 2; pl.position.set((o && o.x) || 0, (o && o.y) || 0, (o && o.z) || 0); pl.receiveShadow = true; g.add(pl);
      return pl;
    }
    // небо: дуга цилиндра (R = 90 м) позади сцены, рисованный градиент по углу места + мягкие облака; без дымки
    function sky(stops, o) {
      o = o || {};
      const Rr = 90, y0 = -14, hh = 64, Wc = 1024, Hc = 1024;
      const [cv, c] = cnv(Wc, Hc);
      for (let y = 0; y < Hc; y++) {
        const wy = y0 + (1 - (y + 0.5) / Hc) * hh, el = Math.atan2(wy - 1.05, Rr) / D2R;
        c.fillStyle = '#' + ramp(stops, el).getHexString(); c.fillRect(0, y, Wc, 1);
      }
      const rn = rng(o.seed || 7);
      c.filter = 'blur(' + (o.blur || 7) + 'px)';
      (o.clouds || []).forEach(cl => {
        const [az, el, w, h, a, col] = cl;
        const cx = (0.5 + az / 90) * Wc, cy = (1 - ((1.05 + Rr * Math.tan(el * D2R)) - y0) / hh) * Hc;
        for (let j = 0; j < 9; j++) {
          const px = cx + (rn() - 0.5) * w * 1.6, py = cy + (rn() - 0.5) * h * 0.7, rr = (0.35 + rn() * 0.45) * w * 0.5;
          const gr = c.createRadialGradient(px, py, 0, px, py, rr);
          gr.addColorStop(0, col || 'rgba(255,255,255,' + a + ')'); gr.addColorStop(1, 'rgba(255,255,255,0)');
          c.fillStyle = gr; c.beginPath(); c.ellipse(px, py, rr, rr * h / w * 1.2, 0, 0, 2 * PI); c.fill();
        }
      });
      c.filter = 'none';
      const t = tex(cv);
      const geo = new T.CylinderGeometry(Rr, Rr, hh, 64, 1, true, PI - PI / 4, PI / 2);
      const m = new T.Mesh(geo, new T.MeshBasicMaterial({ map: t, side: T.BackSide, fog: false, depthWrite: false }));
      m.position.y = y0 + hh / 2; m.renderOrder = -10; m.receiveShadow = false; g.add(m);
      return m;
    }
    // хребет гор: три ряда точек (гребень, плечо, подножие) -> грани с плоскими нормалями (каждая грань своим тоном рампы)
    function ridge(o) {

      B.ridge({ x0: -60, x1: 70, z: -72, dz: 6, n: 44, h0: 5, h1: 15, seed: 21, col: '#957060', env: t => 0.55 + 0.45 * Math.sin(t * PI) });
      B.ridge({ x0: -40, x1: 50, z: -50, dz: 5, n: 40, h0: 2, h1: 9, seed: 8, col: '#7E5A48', env: t => 0.45 + 0.55 * Math.sin(t * PI * 1.3 + 0.2) });
      B.sky([[-20, '#F2DDC6'], [0, '#F3DFC8'], [4, '#E8E1D8'], [8, '#CADCEA'], [16, '#AAC8E4'], [40, '#94B8DC']], { clouds: [], seed: 3 });
    },
  },

  /* 5. «Сливочный шик»: светлая городская площадь, высокие сине-бирюзовые стеклянные башни (сетка окон), мощение, синее небо */
  cream: {
    light: { hemi: ['#E8EEF6', '#E2DACE', 0.64], sun: ['#FFF3E4', 0.52, [-3.5, 7.5, 4.5]], rim: ['#F6F6FF', 0.16], fog: ['#DCE9F2', 8, 160] },
    cam: { A: 12 },
    build(B) {
      const { M, box, rbox, put, T, K, cnv, tex } = B;
      B.ground('#D2CEC7', (c, s) => { c.strokeStyle = 'rgba(150,140,130,.36)'; c.lineWidth = 3; for (let i = 0; i <= 4; i++) { c.beginPath(); c.moveTo(i * s / 4, 0); c.lineTo(i * s / 4, s); c.stroke(); c.beginPath(); c.moveTo(0, i * s / 4); c.lineTo(s, i * s / 4); c.stroke(); } c.strokeStyle = 'rgba(165,155,145,.14)'; c.lineWidth = 2; for (let i = 0; i < 8; i++) { c.beginPath(); c.moveTo(i * s / 8 + s / 16, 0); c.lineTo(i * s / 8 + s / 16, s); c.stroke(); } }, 100);
      // стекло башни: сетка рам, стёкла чуть разные, отражение неба светлеет кверху
      function glassTex(seed, base, hi) {
        const [cv, c] = cnv(256, 512), rn = B.rng(seed);
        const gr = c.createLinearGradient(0, 512, 0, 0); gr.addColorStop(0, base); gr.addColorStop(1, hi); c.fillStyle = gr; c.fillRect(0, 0, 256, 512);
        for (let y = 0; y < 512; y += 32) for (let x = 0; x < 256; x += 32) { c.fillStyle = 'rgba(' + (rn() < 0.5 ? '255,255,255,' : '20,40,60,') + (rn() * 0.08).toFixed(3) + ')'; c.fillRect(x, y, 32, 32); }
        c.fillStyle = 'rgba(30,58,72,.55)'; for (let x = 0; x < 256; x += 32) c.fillRect(x, 0, 4, 512); for (let y = 0; y < 512; y += 32) c.fillRect(0, y, 256, 3);
        return cv;
      }
      function tower(x, z, w, d, h, seed, base, hi) {
        const t = tex(glassTex(seed, base, hi)); t.wrapS = t.wrapT = T.RepeatWrapping;
        const geo = new T.BoxGeometry(w, h, d), uv = geo.attributes.uv, nrm = geo.attributes.normal;
        for (let i = 0; i < uv.count; i++) { const side = Math.abs(nrm.getX(i)) > 0.5 ? d : w; uv.setXY(i, uv.getX(i) * side / 10, uv.getY(i) * h / 20); }
        put(geo, K.toon('#FFFFFF', { map: t }), [x, h / 2, z]);
        box(M('#C9D4DA'), x, 0.6, z + d / 2 + 0.05, w + 0.1, 1.2, 0.2);
      }
      tower(-4.3, -16, 5.4, 8, 42, 1, '#3F6F84', '#7FA9BC');
      tower(-9.5, -28, 8, 9, 64, 2, '#3A6A80', '#86AEC0');
      tower(4.4, -19, 5.8, 8, 50, 3, '#456F86', '#8EB4C6');
      tower(10.5, -33, 8, 8, 76, 4, '#3C6B83', '#7EA6BA');
      tower(7, -62, 10, 10, 58, 5, '#4A7A90', '#93B8CA');
      tower(-1.5, -78, 14, 10, 13, 6, '#507E94', '#9ABDCD');
      // кадки с круглыми деревцами вдоль площади
      [[3.2, -7.5], [-3.6, -9.5], [5.2, -11.5]].forEach(([x, z]) => { rbox(M('#D4CFC8'), x, 0.3, z, 1.0, 0.6, 1.0, 0.06); B.tree(x, z, 0.75, '#8DB27A', '#7CA26C'); });
      B.sky([[-20, '#DCEAF3'], [0, '#DCEAF3'], [6, '#BCD8EC'], [20, '#94C0E2'], [40, '#7FB2DC']], { clouds: [[-20, 18, 200, 50, 0.55], [18, 24, 260, 60, 0.5]], seed: 5 });
    },
  },

  /* 6. «Звезда вечера»: коридор отеля — кремовые стены с панелями, тёплые бра, тёмные двери, ковровая дорожка, точка схода */
  floral: {
    light: { hemi: ['#F4E6D2', '#9A7E66', 0.62], sun: ['#FFE6C8', 0.42, [0.8, 6, 5]], rim: ['#FFEBD8', 0.22], fog: ['#E8D6BC', 7, 42], blob: 0.9,
      extra: [T => { const p = new T.PointLight('#FFD9A8', 0.35, 9, 2); p.position.set(0, 2.6, -1.5); return p; }] },
    hero: { key: ['#FFF7EE', 0.48] },
    cam: { A: 10 },
    build(B) {
      const { M, box, rbox, sph, cyl, put, T, K, cnv, tex, halo } = B;
      const Z0 = 7, Z1 = -30, XW = 1.85, HH = 3.1, len = Z0 - Z1, zc = (Z0 + Z1) / 2;
      // пол: тёмный полированный край, ковровая дорожка с каймой и розетками (без надписей)
      box(M('#7E6450'), 0, -0.01, zc, XW * 2, 0.02, len);
      const [cv, c] = cnv(256, 256);
      c.fillStyle = '#D6C8B0'; c.fillRect(0, 0, 256, 256);
      c.fillStyle = '#6E584A'; c.fillRect(0, 0, 20, 256); c.fillRect(236, 0, 20, 256);
      c.fillStyle = '#B8A28A'; c.fillRect(24, 0, 4, 256); c.fillRect(228, 0, 4, 256);
      // ромбы и розетки — тон в тон, мелкий шаг (за героиней не пестрит)
      c.strokeStyle = '#BCA78E'; c.lineWidth = 3;
      [[128, 0], [128, 128], [128, 256]].forEach(([x, y]) => { c.beginPath(); c.moveTo(x, y - 64); c.lineTo(x + 92, y); c.lineTo(x, y + 64); c.lineTo(x - 92, y); c.closePath(); c.stroke(); });
      const ros = (x, y, r) => { for (let k = 0; k < 8; k++) { const a = k * PI / 4; c.fillStyle = k % 2 ? '#BCA68C' : '#B09A80'; c.beginPath(); c.ellipse(x + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.55, r * 0.42, r * 0.2, a, 0, 2 * PI); c.fill(); } c.fillStyle = '#9C846C'; c.beginPath(); c.arc(x, y, r * 0.25, 0, 2 * PI); c.fill(); };
      ros(128, 0, 34); ros(128, 128, 34); ros(128, 256, 34); ros(60, 64, 16); ros(196, 64, 16); ros(60, 192, 16); ros(196, 192, 16);
      const ct = tex(cv); ct.wrapS = ct.wrapT = T.RepeatWrapping; ct.repeat.set(1, len / 1.1);
      const carpet = new T.Mesh(new T.PlaneGeometry(2.2, len), K.toon('#FFFFFF', { map: ct })); carpet.rotation.x = -PI / 2; carpet.position.set(0, 0.006, zc); carpet.receiveShadow = true; B.g.add(carpet);
      // стены, плинтус, рейка, карниз, потолок
      const wallM = M('#EFE5D4'), trim = M('#E4D7C3'), ceil = M('#F3EBDE');
      [-1, 1].forEach(s => {
        box(wallM, s * (XW + 0.1), HH / 2, zc, 0.2, HH, len);
        box(trim, s * (XW - 0.01), 0.09, zc, 0.04, 0.18, len);
        box(trim, s * (XW - 0.015), 0.95, zc, 0.03, 0.05, len);
        box(trim, s * (XW - 0.03), HH - 0.1, zc, 0.08, 0.2, len);
      });
      box(ceil, 0, HH + 0.05, zc, XW * 2 + 0.4, 0.1, len);
      // светильники в потолке — тёплые прямоугольники
      const glow = new T.MeshBasicMaterial({ color: '#FFF0D6', fog: true });
      for (let z = 2; z > Z1 + 2; z -= 3.4) { const m = new T.Mesh(K.GEO.plane, glow); m.rotation.x = PI / 2; m.position.set(0, HH - 0.001, z); m.scale.set(0.9, 0.5, 1); B.g.add(m); }
      // двери (тёмное дерево, наличник, ручка), панели стен, бра с ореолами
      const doorM = M('#3E2C24'), archi = M('#E6DAC7'), gold = M('#D4B070', { emissive: new T.Color('#5A4020') }), shadeM = new T.MeshBasicMaterial({ color: '#FFE4B8', fog: true });
      const doors = { '-1': [-3.2, -9.6, -16, -22.4], '1': [-6.4, -12.8, -19.2, -25.6] };
      [-1, 1].forEach(s => {
        const xw = s * XW;
        doors[String(s)].forEach(z => {
          rbox(archi, xw - s * 0.03, 1.2, z, 0.06, 2.55, 1.3, 0.02);
          rbox(doorM, xw - s * 0.05, 1.12, z, 0.06, 2.3, 1.05, 0.015);
          [0.62, 1.6].forEach(y => rbox(M('#4A362C'), xw - s * 0.085, y, z, 0.02, y < 1 ? 0.8 : 0.9, 0.78, 0.01));
          sph(gold, xw - s * 0.11, 1.08, z + 0.36, 0.035);
        });
        // панели и бра между дверями
        for (let z = 3.6; z > Z1 + 1; z -= 3.2) {
          const near = doors[String(s)].some(dz => Math.abs(dz - z) < 1.1);
          if (near) continue;
          [[0.5, 0.62], [1.95, 1.45]].forEach(([y, h]) => {
            rbox(trim, xw - s * 0.012, y, z, 0.02, h, 1.5, 0.008);
            rbox(wallM, xw - s * 0.022, y, z, 0.02, h - 0.1, 1.4, 0.008);
          });
          // бра: пластина, абажур (светится), ореол на стене
          rbox(gold, xw - s * 0.03, 1.82, z, 0.03, 0.16, 0.08, 0.01);
          const sh = new T.Mesh(new T.CylinderGeometry(0.08, 0.12, 0.18, 12), shadeM); sh.position.set(xw - s * 0.16, 1.98, z); B.g.add(sh);
          halo(xw - s * 0.02, 2.0, z, 1.1, 0.55, s * -PI / 2);
          halo(xw - s * 0.2, 1.98, z, 0.42, 0.7);
        }
      });
      // консоли с настольными лампами у стен
      [[-1, -6.4], [1, -9.6], [-1, -12.8]].forEach(([s, z]) => {
        const x = s * (XW - 0.25);
        box(doorM, x, 0.78, z, 0.42, 0.05, 1.0);
        [[-0.4], [0.4]].forEach(([dz]) => box(doorM, x, 0.39, z + dz, 0.05, 0.78, 0.05));
        cyl(gold, x, 0.95, z, 0.06, 0.3);
        const sh = new T.Mesh(new T.CylinderGeometry(0.12, 0.2, 0.26, 14), shadeM); sh.position.set(x, 1.22, z); B.g.add(sh);
        halo(x, 1.22, z + 0.01, 0.7, 0.6);
      });
      // дальний конец: светлая арка окна
      box(wallM, 0, HH / 2, Z1 - 0.1, XW * 2, HH, 0.2);
      box(new T.MeshBasicMaterial({ color: '#FFF4E2', fog: false }), 0, 1.45, Z1 + 0.01, 1.3, 2.3, 0.02);
      [-0.33, 0.33].forEach(x => box(archi, x, 1.45, Z1 + 0.03, 0.05, 2.3, 0.03)); box(archi, 0, 1.7, Z1 + 0.03, 1.3, 0.05, 0.03);
    },
  },
};

/* лошадь: капсулы и шары; морда тёмная, грива и хвост почти чёрные, белая проточина; смотрит налево (−x) и к камере */
function horse(B, o) {
  const { T, K, M, g } = B;
  const coat = M('#7B4C33'), coatD = M('#5C3826'), mane = M('#2E1F18'), hoof = M('#3A2A22'), blaze = M('#EFE6DA'), eye = M('#1E1614'), muz = M('#4E3426'), strap = M('#3A2620');
  const cap = (r, l) => new T.CapsuleGeometry(r, l, 6, 12);
  const root = new T.Group(); root.position.set(o.x, 0, o.z); root.rotation.y = o.ry || 0; root.scale.setScalar(o.s || 1); g.add(root);
  const body = new T.Group(); root.add(body);
  const P = (geo, m, p, s, r, par) => { const x = new T.Mesh(geo, m); x.position.fromArray(p); if (s) x.scale.fromArray(s); if (r) x.rotation.fromArray(r); x.receiveShadow = false; (par || body).add(x); return x; };
  P(cap(0.34, 0.95), coat, [0, 1.18, 0], [1, 1, 0.95], [0, 0, PI / 2]);
  P(K.GEO_HI.sph, coat, [-0.55, 1.22, 0], [0.4, 0.42, 0.36]);
  P(K.GEO_HI.sph, coat, [0.6, 1.2, 0], [0.4, 0.4, 0.38]);
  [[-0.55, 0.15], [-0.55, -0.15], [0.62, 0.15], [0.62, -0.15]].forEach(([x, z], i) => {
    P(cap(0.075, 0.7), i < 2 ? coat : coatD, [x, 0.55, z], [1, 1, 1]);
    P(K.GEO_HI.cyl, coatD, [x, 0.2, z], [0.075, 0.22, 0.075]);
    P(K.GEO_HI.cyl, hoof, [x, 0.05, z], [0.085, 0.1, 0.085]);
  });
  // шея (поворот вокруг основания) и голова: скула, сужающаяся морда, ноздри, проточина, недоуздок
  const neck = new T.Group(); neck.position.set(-0.75, 1.35, 0); body.add(neck);
  const neck0 = 0.85; neck.rotation.z = neck0;
  P(cap(0.17, 0.62), coat, [0, 0.42, 0], [1, 1, 0.85], null, neck);
  P(K.GEO.box, mane, [0.12, 0.45, 0], [0.07, 0.82, 0.08], [0, 0, 0.1], neck);
  const headG = new T.Group(); headG.position.set(0, 0.84, 0); neck.add(headG);
  const hb = new T.Group(); hb.rotation.set(0, o.turn == null ? 0.5 : o.turn, -neck0 + 0.85); headG.add(hb);
  P(K.GEO_HI.sph, coat, [-0.04, 0.0, 0], [0.17, 0.15, 0.125], null, hb);
  P(cap(0.095, 0.3), coat, [-0.27, -0.01, 0], [1, 1, 0.9], [0, 0, PI / 2 + 0.06], hb);
  P(K.GEO_HI.sph, muz, [-0.47, -0.03, 0], [0.105, 0.095, 0.09], null, hb);
  [-1, 1].forEach(s => P(K.GEO_HI.sph, eye, [-0.54, -0.01, s * 0.045], [0.018, 0.022, 0.016], null, hb));
  P(K.GEO.box, blaze, [-0.27, 0.09, 0], [0.32, 0.02, 0.045], [0, 0, -0.06], hb);
  [-1, 1].forEach(s => P(K.GEO_HI.sph, eye, [-0.08, 0.07, s * 0.112], [0.026, 0.028, 0.02], null, hb));
  const ears = [-1, 1].map(s => { const e = new T.Group(); e.position.set(0.04, 0.12, s * 0.065); hb.add(e); P(K.GEO.cone, coat, [0, 0.07, 0], [0.04, 0.14, 0.03], null, e); return e; });
  P(K.GEO.box, mane, [-0.02, 0.135, 0], [0.12, 0.04, 0.07], [0, 0, -0.3], hb);
  P(new T.TorusGeometry(1, 0.1, 6, 18), strap, [-0.36, -0.015, 0], [0.105, 0.1, 0.1], [0, PI / 2, 0], hb);
  [-1, 1].forEach(s => P(K.GEO.box, strap, [-0.17, 0.02, s * 0.118], [0.4, 0.022, 0.012], [0, 0, 0.32], hb));
  const tail = new T.Group(); tail.position.set(0.95, 1.32, 0); body.add(tail);
  P(cap(0.07, 0.55), mane, [0.08, -0.36, 0], [1, 1, 1], [0, 0, 0.25], tail);
  // контур — тоньше и светлее, чем у героини (фон мягче)
  const olM = new T.ShaderMaterial({ uniforms: { thick: { value: 0.0009 }, col: { value: new T.Color('#5A4038') } },
    vertexShader: 'uniform float thick; void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); vec3 n = normalize(normalMatrix * normal); mv.xyz += n * thick * (-mv.z); gl_Position = projectionMatrix * mv; }',
    fragmentShader: 'uniform vec3 col; void main(){ gl_FragColor = vec4(col, 1.0); }', side: T.BackSide, fog: false });
  const list = []; root.traverse(m => { if (m.isMesh && m.geometry.type !== 'BoxGeometry' && m.geometry.type !== 'ConeGeometry' && m.geometry.type !== 'TorusGeometry') list.push(m); });
  list.forEach(m => { const ol = new T.Mesh(m.geometry, olM); ol.position.copy(m.position); ol.rotation.copy(m.rotation); ol.scale.copy(m.scale); m.parent.add(ol); });
  return { root, body, neck, neck0, headG, tail, ears };
}
