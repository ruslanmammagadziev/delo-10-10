  <!-- Стенд единого города и «Замер» для телефона (не игра). Игра — index.html, город там же, через WorldHub. -->
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .stats { position: absolute; left: 10px; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); z-index: 95; font-size: 12px; max-width: calc(100% - 20px); font-family: 'Nunito', system-ui, sans-serif; }
    .stats .pill { display: inline-block; padding: 5px 10px; border-radius: 99px; background: rgba(255,253,249,.9); font-weight: 900; color: #3A2E3F; cursor: pointer; box-shadow: 0 2px 0 rgba(58,46,63,.12); min-width: 58px; text-align: center; }
    .stats .pill.ok { color: #3E8E6A; } .stats .pill.mid { color: #C98A2B; } .stats .pill.bad { color: #C2405B; }
    .stats .panel { margin-top: 6px; padding: 10px 12px; border-radius: 14px; background: rgba(255,253,249,.98); box-shadow: 0 4px 14px rgba(58,46,63,.14); width: 268px; max-width: 100%; }
    .stats .row { margin: 2px 0; font-weight: 700; line-height: 1.35; } .stats .row.dim { color: #6E6272; font-weight: 600; font-size: 11px; word-break: break-word; }
    .stats .btns { display: flex; gap: 6px; margin-top: 8px; } .stats .btns button { flex: 1; border: 0; border-radius: 10px; padding: 7px 4px; background: #F6E7EB; color: #3A2E3F; font-weight: 800; font-size: 11px; cursor: pointer; font-family: inherit; }
    .stats .btns button.on { background: #C2405B; color: #fff; } .stats .btns button.wide { background: #3A2E3F; color: #fff; }
    .stand-modal { position: fixed; inset: 0; z-index: 99; background: rgba(58,46,63,.45); display: grid; place-items: center; padding: 16px; font-family: 'Nunito', system-ui, sans-serif; }
    .stand-modal .card { background: #FFFDF9; border-radius: 20px; padding: 16px; width: 100%; max-width: 560px; max-height: 90%; overflow: auto; }
    .stand-modal .ttl { font-weight: 800; color: #C2405B; font-size: 18px; margin-bottom: 8px; }
    .stand-modal pre { white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; line-height: 1.45; background: #FFF4EC; padding: 10px; border-radius: 12px; margin: 0; -webkit-user-select: text; user-select: text; }
    .stand-modal .btns { display: flex; gap: 8px; margin-top: 10px; } .stand-modal .btns button { flex: 1; border: 0; border-radius: 14px; padding: 12px; font-weight: 900; font-size: 15px; background: #C2405B; color: #fff; font-family: inherit; }
    .stand-modal .btns .close { background: #F2DCE2; color: #3A2E3F; } .stand-modal .note { margin-top: 8px; font-size: 12px; color: #6E6272; font-weight: 700; }
    .benching .w-ui { display: none !important; }
  </style>
