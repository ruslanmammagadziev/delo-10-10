  <script>
  (function () {
    'use strict';
    const T = window.THREE, V = window.VILLAGE = window.VILLAGE || {}, PI = Math.PI, TAU = PI * 2;
    const Q = new URLSearchParams(location.search);
    const named = Q.get('named') !== '0'; V.named = named;
    const season = Q.get('season') === 'winter' ? 'winter' : 'autumn';
    const quality = Q.get('q') === 'high' ? 'high' : 'low';
    const DEBUG = Q.get('debug') === '1';
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; };
    const $ = id => document.getElementById(id);
    if (Q.get('shot') === '1') document.body.classList.add('shot');

    /* ---------- рендер ---------- */
    const canvas = $('c');
    const lowDpr = +(Q.get('dpr') || (quality === 'high' ? Math.min(window.devicePixelRatio || 1, 1.6) : Math.min(window.devicePixelRatio || 1, 1)));
    const renderer = new T.WebGLRenderer({ canvas, antialias: quality === 'high', powerPreference: 'default' });
    renderer.setPixelRatio(lowDpr);
    renderer.info.autoReset = false;
    if (quality === 'high') { renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFShadowMap; }
    const scene = new T.Scene();
    const camera = new T.PerspectiveCamera(58, 1, 0.1, 1600);
    function resize() { const w = window.innerWidth || 390, h = window.innerHeight || 844; renderer.setSize(w, h, false); camera.aspect = w / h; if (!S.view && !S.look) camera.fov = w / h < 0.8 ? 58 : 48; camera.updateProjectionMatrix(); }

    /* ---------- состояние ---------- */
    const S = {
      region: null, rid: null, mode: 'walk', px: 0, py: 0, pz: 0, ang: 0, vx: 0, vz: 0, yaw: 0, camInit: false, manualT: 0, walking: false, moveT: 0,
      sitting: null, view: null, busy: false, near: null, nearKind: null, lastGreet: {}, lineIdx: {}, frames: 0, fps: 0, info: { calls: 0, tris: 0 },
      flags: { bread: false, jug: false, granny: false, stones: new Set(), pendant: false }, level: 'ground',
      // волна 4
      climb: null, look: null, inShop: null, iaDy: 0, wipeT: 0, wipeDelay: 0, bag: [], pats: 0, stickers: [], night: 0,
      // W4A: зиплайн, мини-гольф, танец на свадьбе, выбор машины, каз
      zip: null, zipEv: [], golf: null, dance: null, animSt: null,
      carId: (() => { const q = Q.get('car'); if (q === 'sedan' || q === 'coupe') return q; try { const v = localStorage.getItem('w4.car'); if (v === 'sedan' || v === 'coupe') return v; } catch (e) { /* без хранилища */ } return 'coupe'; })(),
    };
    window.__villageState = S;

    /* ---------- героиня: модель автора со скелетом (город) → статуэтка → кукла ---------- */
    let H = null, A = null, hero = null, heroKind = 'doll', blob = null, IA = null;
    async function makeHero() {
      try { if (window.WORLD && WORLD.createKit) { H = WORLD.createKit({ rim: ['#FFE8D0', 0.22] }); A = WORLD.makeActors(H); } } catch (e) { console.warn('village: world kit', e); H = null; A = null; }
      let H3 = null;
      if (A && window.HERO3D && T.GLTFLoader && Q.get('hero') !== 'off') { try { H3 = await Promise.race([HERO3D.load(), new Promise(r => setTimeout(() => r(null), 9000))]); } catch (e) { H3 = null; } }
      if (H3 && A) { try { hero = A.buildHeroRig(null, H3); if (hero) heroKind = 'rig'; } catch (e) { console.warn('village: hero rig', e); hero = null; } }
      if (!hero && H3 && A) { try { hero = A.buildHeroGLB(null, H3); heroKind = 'statue'; } catch (e) { hero = null; } }
      if (!hero) { hero = dollHero(); heroKind = 'doll'; }
      if (H && hero.root) { const seen = new Set(); hero.root.traverse(m => { if (m.isMesh && m.material && m.material.isMeshToonMaterial && !seen.has(m.material)) { seen.add(m.material); H.addRim(m.material, 1); } }); }
      const cv = document.createElement('canvas'); cv.width = cv.height = 64; const c = cv.getContext('2d'), g = c.createRadialGradient(32, 32, 2, 32, 32, 30); g.addColorStop(0, 'rgba(70,58,72,.34)'); g.addColorStop(1, 'rgba(70,58,72,0)'); c.fillStyle = g; c.fillRect(0, 0, 64, 64);
      blob = new T.Mesh(new T.PlaneGeometry(0.85, 0.55), new T.MeshBasicMaterial({ map: new T.CanvasTexture(cv), transparent: true, depthWrite: false })); blob.rotation.x = -PI / 2; blob.renderOrder = 1;
      try { shadowProxy = makeShadowProxy(); } catch (e) { console.warn('village: shadow proxy', e); shadowProxy = null; }
      // волна 4: настоящие руки (js/interact.js) — только у героини со скелетом
      if (window.Interact && hero.rig && hero.rig.anim && Q.get('ia') !== '0') {
        try {
          IA = Interact.create({ THREE: T, anim: hero.rig.anim, heroRoot: hero.root, scene, camera,
            setRoot: (p, yaw) => { S.px = p.x; S.pz = p.z; S.ang = yaw; const g = S.region ? S.region.ground(p.x, p.z) : p.y; S.iaDy = p.y - g; S.py = g; },
            on: (n) => { (S.iaEv = S.iaEv || []).push(n); if (S.iaEv.length > 80) S.iaEv.shift(); if (n === 'busy') toast('Руки заняты', 1200); } });
        } catch (e) { console.warn('village: interact', e); IA = null; }
      }
    }
    /* ---------- W4A: тень героини на high — простые формы по костям (голова, корпус, ноги ≈ 600 треуг.) вместо полной сетки
       (≈ 28 тыс. треуг. в проходе теней). Формы невидимы в кадре (colorWrite: false) и лишь отбрасывают тень; ноги шагают ---------- */
    let shadowProxy = null;
    function makeShadowProxy() {
      if (quality !== 'high' || Q.get('heroShadow') === 'full' || !hero || !hero.rig || !hero.rig.anim || !hero.rig.anim.bones) return null;
      const B = hero.rig.anim.bones; if (!B.head || !B.hips || !B.thigh_L || !B.foot_L || !B.thigh_R || !B.foot_R) return null;
      const mat = new T.MeshBasicMaterial({ colorWrite: false, depthWrite: false }), parts = [];
      const mk = geo => { const m = new T.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = false; m.frustumCulled = false; m.name = 'heroShadowProxy'; m.renderOrder = -1; scene.add(m); parts.push(m); return m; };
      const sph = new T.SphereGeometry(1, 12, 8), cyl = new T.CylinderGeometry(1, 1, 1, 10, 1);
      const P = { head: mk(sph), torso: mk(cyl), hair: mk(sph), legL: mk(cyl), legR: mk(cyl) };
      const a = new T.Vector3(), b = new T.Vector3(), d = new T.Vector3(), up = new T.Vector3(0, 1, 0);
      const between = (m, p0, p1, r) => { d.subVectors(p1, p0); const l = d.length() || 1e-3; m.position.copy(p0).addScaledVector(d, 0.5); m.scale.set(r, l, r); m.quaternion.setFromUnitVectors(up, d.multiplyScalar(1 / l)); };
      hero.root.traverse(m => { if (m.isMesh && m.castShadow && m.name !== 'heroShadowProxy') { m.castShadow = false; m.userData.shadow0 = true; } });
      const sc = () => hero.root.scale.y || 1;
      return { parts, update() {
        const vis = hero.root.visible && hero.root.parent === scene; parts.forEach(m => { m.visible = vis; }); if (!vis) return;
        const k = sc();
        B.head.getWorldPosition(a); P.head.position.copy(a).addScaledVector(up, 0.12 * k); P.head.scale.set(0.3 * k, 0.33 * k, 0.3 * k);
        B.hips.getWorldPosition(b); between(P.torso, b, a, 0.17 * k);
        P.hair.position.copy(a).addScaledVector(up, -0.32 * k); P.hair.scale.set(0.24 * k, 0.36 * k, 0.2 * k);
        B.thigh_L.getWorldPosition(a); B.foot_L.getWorldPosition(b); between(P.legL, a, b, 0.07 * k);
        B.thigh_R.getWorldPosition(a); B.foot_R.getWorldPosition(b); between(P.legR, a, b, 0.07 * k);
      }, dispose() { parts.forEach(m => { scene.remove(m); }); sph.dispose(); cyl.dispose(); mat.dispose(); hero.root.traverse(m => { if (m.userData.shadow0) m.castShadow = true; }); } };

    /* ---------- волна 4: лестница в башне (h.climb) — палец вверх/вниз или кнопки «Вверх» / «Вниз» ---------- */
    const atTmp = {}, camW = new T.Vector3(), lookW = new T.Vector3();
    function startClimb(from) {
      const c = S.region.climb; if (!c || !c.at) return false;
      if (IA) { try { IA.cancel(); } catch (e) { /* ok */ } }
      S.climb = { s: from === 'top' ? c.len : 0, dir: from === 'top' ? -1 : 1, auto: from === 'top' ? -1 : 1, camMode: null };
      S.mode = 'climb'; S.sitting = null; S.view = null; S.look = null; S.level = 'ground';

    }
    function stepClimb(dt) {
      const c = S.region.climb, C = S.climb; if (!c || !C) return;
      let inp = 0; const jy = (keys.u ? -1 : 0) + (keys.d ? 1 : 0) + (Math.abs(joy.y) > 0.25 ? joy.y : 0);
      if (jy < -0.2) inp = 1; else if (jy > 0.2) inp = -1;
      if (inp) C.auto = 0;
      const v = S.busy ? 0 : (inp || C.auto), spd = 1.55;
      if (v) { C.s = clamp(C.s + v * spd * dt, 0, c.len); C.dir = v > 0 ? 1 : -1; }
      const p = c.at(C.s, atTmp); S.px = p.x; S.py = p.y; S.pz = p.z; S.ang = C.dir > 0 ? p.ry : p.ry + PI; S.walking = !!v;
      if (C.dir > 0 && C.s >= c.len - 1e-4) finishClimb('top');
      else if (C.dir < 0 && C.s <= 1e-4) finishClimb('bottom');
    }

      else { S.level = 'ground'; const d = c.door; S.px = d[0]; S.pz = d[2]; S.py = S.region.ground(d[0], d[2]); const tw = S.region.places.tower; S.ang = Math.atan2(d[0] - tw.x, d[2] - tw.z); S.yaw = S.ang; }

    async function useExit(ex) {

      const to = ex.to || (S.rid === 'hotel' ? (ex.id === 'toRoad' ? 'serpentine' : EXIT_TO[ex.id]) : null);
      if (S.rid === 'kubachi' && ex.id === 'toHotel') {   // волна 6: наверху дороги мимо школы — к отелю
        if (haveRegion('hotel')) await fade('К отелю…', () => loadRegion('hotel', 'kubachi'));

      } else {
        // край города: в игре здесь начинается город; в стенде — карточка и снова к щиту
        S.trip.down = S.dir === 'down' || S.trip.down; S.trip.city++;

    // выходы серпантина срабатывают сами, когда машина въезжает в облако (вооружаются, когда машина от них отъехала)
    function checkExits() {
      const h = S.region; if (!h || S.mode !== 'drive' || !drv || S.busy) return null;
      for (const ex of h.exits) {
        if (ex.walk || (ex.level && ex.level !== 'ground')) continue;   // волна 6: «Сесть в машину» у стоянки — только пешком
        const d = Math.hypot(drv.S.x - ex.x, drv.S.z - ex.z);

        if (S.exitArmed[ex.id] && d < ex.r) { S.exitArmed[ex.id] = false; S.lastExit = ex.id; useExit(ex); return ex.id; }
      }
      return null;
    }

          if (o.still) { joy.x = joy.y = 0; left = 1e9; } if (left <= 0) { const a = rnd() * Math.PI * 2, m = 0.5 + rnd() * 0.5; joy.x = Math.sin(a) * m; joy.y = Math.cos(a) * m; left = Math.round((0.6 + rnd() * 2.2) / dt); if (rnd() < 0.25) { S.manualT = 2.5; S.yaw += (rnd() - 0.5) * 3; } }
          left--;
          const y0 = S.py; stepWalk(dt); updCamera(dt); out.steps++;
          out.moved += Math.hypot(S.px - lx0, S.pz - lz0); lx0 = S.px; lz0 = S.pz;
          if (Math.abs(S.py - y0) > 0.75) note('drop', { dy: +(S.py - y0).toFixed(2) });
          const g = h.ground(S.px, S.pz); if (Math.abs(S.py - g) > 0.8) note('float', { g: +g.toFixed(2) });
          const c = cols.find(c => inC(c, S.px, S.pz, S.py, 0.05)); if (c) note('inside', { id: c.id });
          if (h.walkable && !h.walkable(S.px, S.pz)) { offRun++; if (offRun === 30) note('off'); } else offRun = 0;
          if (i % every === 0) {
            out.samples++;
            const cp = camera.position; lk.set(S.px, S.py + 1.35, S.pz);
            const ci = camIn(cp.x, cp.y, cp.z); if (ci) note('camIn', { id: ci.id, cam: [+cp.x.toFixed(1), +cp.y.toFixed(1), +cp.z.toFixed(1)] });
            if (cp.y < h.ground(cp.x, cp.z) + 0.25) note('camLow', { cam: [+cp.x.toFixed(2), +cp.y.toFixed(2), +cp.z.toFixed(2)], g: +h.ground(cp.x, cp.z).toFixed(2), kind: h.groundInfo ? h.groundInfo(cp.x, cp.z).kind : '' });
            if (h.rayHit && h.rayHit(lk, cp) < 0.97) note('camBehind', { cam: [+cp.x.toFixed(2), +cp.y.toFixed(2), +cp.z.toFixed(2)] });
            if (meshes) {
              const d = lk.distanceTo(cp); dir.copy(cp).sub(lk).normalize(); rc.set(lk, dir); rc.far = d; rc.near = 0.35;
              const hit = rc.intersectObjects(meshes, false)[0];
              if (hit && hit.distance < d - 0.25) { const hp = hit.point, cr = (h.camColliders || []).some(c => Math.abs(hp.x - c.x) < c.w / 2 + 0.6 && Math.abs(hp.z - c.z) < c.d / 2 + 0.6 && hp.y > c.y0 - 0.6 && hp.y < c.y1 + 0.6); note('camGeo', { at: +(hit.distance / d).toFixed(2), obj: (hit.object.name || hit.object.parent && hit.object.parent.name || '?') + (cr ? ':crown' : ''), hp: [+hp.x.toFixed(1), +hp.y.toFixed(1), +hp.z.toFixed(1)], cam: [+cp.x.toFixed(1), +cp.y.toFixed(1), +cp.z.toFixed(1)] }); }
            }
          }
        }
        joy.x = joy.y = 0; S.vx = S.vz = 0; S.walking = false;
        h.npcs.forEach(n => { S.lastGreet[n.id] = performance.now(); });
        out.moved = +out.moved.toFixed(1); out.end = [+S.px.toFixed(2), +S.pz.toFixed(2), +S.py.toFixed(2)];
        return out;
      },
      // ---------- волна 4 ----------
      regions: () => ['kubachi', 'serpentine', 'hotel'].filter(haveRegion),
      hero: () => ({ kind: heroKind, ia: !!IA, iaBusy: !!(IA && IA.busy()), car: car ? (Q.get('car') === 'sedan' ? 'sedan' : 'spare') : null }),
      // лестница в башне: начать (снизу / сверху) и пройти её без рендера — та же логика шага и камеры, что в игре
      climb: from => startClimb(from === 'top' ? 'top' : 'bottom'),
      simClimb: (o = {}) => {
        const h = S.region; if (!h || !h.climb || !h.climb.at) return null;
        if (!S.climb) startClimb(o.from === 'top' ? 'top' : 'bottom');
        const dt = o.dt || 1 / 60, tw = h.places.tower, out = { steps: 0, len: +h.climb.len.toFixed(2), maxDy: 0, maxDxz: 0, ymin: 1e9, ymax: -1e9, modes: {}, camRmax: 0, camLow: 0, heroRmax: 0 };
        let px = S.px, py = S.py, pz = S.pz;
        for (let i = 0; i < (o.steps || 6000) && S.climb; i++) {
          stepClimb(dt); updCamera(dt); out.steps++;
          out.maxDy = Math.max(out.maxDy, Math.abs(S.py - py)); out.maxDxz = Math.max(out.maxDxz, Math.hypot(S.px - px, S.pz - pz)); px = S.px; py = S.py; pz = S.pz;
          out.ymin = Math.min(out.ymin, S.py); out.ymax = Math.max(out.ymax, S.py);
          if (!S.climb) break;
          const m = S.climb.camMode || '?'; out.modes[m] = (out.modes[m] || 0) + 1;
          const cp = camera.position, r = Math.hypot(cp.x - tw.x, cp.z - tw.z);
          if (m === 'inside') { out.camRmax = Math.max(out.camRmax, r); out.heroRmax = Math.max(out.heroRmax, Math.hypot(S.px - tw.x, S.pz - tw.z)); }
          if (cp.y < h.climb.at(0, {}).y - 0.4) out.camLow++;
        }
        out.done = !S.climb; out.level = S.level; out.end = [+S.px.toFixed(2), +S.py.toFixed(2), +S.pz.toFixed(2)];
        ['maxDy', 'maxDxz', 'ymin', 'ymax', 'camRmax', 'heroRmax'].forEach(k => { out[k] = +out[k].toFixed(3); });
        return out;
      },
      // «Осмотреться» с башни: включить (id, yaw, pitch, fov) / выключить (false)
      look: (id, yaw, pitch, fov) => {
        if (id === false || id === null) { stopLook(); return null; }
        const looks = S.region.camera.looks || {}; id = id || 'tower_top'; if (!looks[id]) return false;
        if (!S.look || S.look.id !== id) startLook(id);
        if (yaw != null) S.look.yaw = yaw; if (pitch != null) S.look.pitch = clamp(pitch, S.look.L.pitchMin, S.look.L.pitchMax); if (fov != null) S.look.fov = clamp(fov, S.look.L.fovMin, S.look.L.fovMax);
        return { id, yaw: S.look.yaw, pitch: S.look.pitch, fov: S.look.fov };
      },
      // карточка на экране (лавка, пекарня, музей…): что показано и нажать кнопку по номеру или тексту
      card: () => { if (!$('card').classList.contains('on')) return null; const t = $('cardBox').querySelector('.t'); return { title: t ? t.textContent : '', lines: [...$('cardBox').querySelectorAll('p')].map(p => p.textContent), buttons: [...$('cardBox').querySelectorAll('button')].map(b => b.textContent) }; },
      pick: v => { if (!$('card').classList.contains('on')) return false; const bs = [...$('cardBox').querySelectorAll('button')]; const b = typeof v === 'number' ? bs[v] : bs.find(x => x.textContent.indexOf(v) >= 0); if (!b) return false; b.click(); return b.textContent; },
      // лавки: зайти (shop_food | shop_craft | shop_cloth), купить n-й товар, выйти
      shop: id => { const sp = S.region.spots.find(s => s.id === id); if (!sp) return false; S.level = 'ground'; S.px = sp.x; S.pz = sp.z; S.py = S.region.ground(sp.x, sp.z); useSpot(sp); return true; },
      inShop: () => (S.inShop ? { id: S.inShop.id, bag: S.bag.slice(), buying: S.shopBuy || null, card: !!$('card').classList.contains('on') } : null),
      buy: i => window.__village.pick(i | 0),
      leaveShop: () => { if (!S.inShop) return false; if ($('card').classList.contains('on')) window.__village.pick('Выйти'); else leaveShop(S.inShop); return true; },
      // большой базар (true | false | undefined = по дню недели)
      bazaar: b => (S.region && S.region.setBazaar ? S.region.setBazaar(b) : false),
      // день/ночь: час (22.5 — ночь) или 'morning'; без DayNight — сразу setNight(0..1)
      night: hr => {
        if (dn && window.DayNight) { DayNight.set(hr === undefined ? 22.5 : hr, { persist: false, instant: true }); return { hour: +DayNight.hour().toFixed(2), phase: DayNight.phase(), lamps: dn.lampsOn() }; }
        const k = hr === undefined ? 1 : (typeof hr === 'number' && hr <= 1 ? hr : 0); if (S.region.setNight) S.region.setNight(k); S.night = k; return { k };
      },
      setNight: k => { if (!S.region.setNight) return false; S.night = k; S.region.setNight(k); return true; },
      clock: v => (S.region && S.region.setClock ? S.region.setClock(v) : false),
      // коровы и «коровья тропа»
      pats: () => ({ list: (S.region.pats || []).map(p => ({ id: p.id, x: +p.x.toFixed(2), z: +p.z.toFixed(2), r: p.r })), stepped: S.pats, stickers: S.stickers.slice(), events: (S.evLog || []).slice(-10) }),
      // подойти к лепёшке за 1,6 м и наступить (как пальцем на джойстике) → { hit, pats, sticker }
      stepOnPat: (i, from) => new Promise(res => {
        const p = (S.region.pats || [])[i | 0]; if (!p) { res(null); return; }
        const a = from === undefined ? S.yaw : from; S.mode = 'walk'; S.level = 'ground'; S.view = null; S.sitting = null; S.look = null;
        S.px = p.x - Math.sin(a) * 1.6; S.pz = p.z - Math.cos(a) * 1.6; S.py = S.region.ground(S.px, S.pz); S.camInit = false;
        const n0 = S.pats, t0 = performance.now();
        const kk = () => { const dx = p.x - S.px, dz = p.z - S.pz, d = Math.hypot(dx, dz);
          if (S.pats > n0 || performance.now() - t0 > 5000 || d < 0.06) { joy.x = joy.y = 0; const hit = S.pats > n0; setTimeout(() => res({ hit, pats: S.pats, d: +d.toFixed(2), sticker: S.stickers.slice(-1)[0] || null }), hit ? 800 : 0); return; }
          const b = Math.atan2(dx, dz) - S.yaw, m = d < 0.5 ? 0.35 : 0.7; joy.x = -Math.sin(b) * m; joy.y = -Math.cos(b) * m; requestAnimationFrame(kk); };
        requestAnimationFrame(kk);
      }),
      cows: () => S.region.npcs.filter(n => n.speaker === 'cow').map(n => ({ id: n.id, x: +n.root.position.x.toFixed(2), z: +n.root.position.z.toFixed(2), vis: n.root.visible })),
      // родник с крышкой (js/interact.js: drinkSpring)
      spring: () => { const sp = S.region.spots.find(s => s.id === 'spring_lid'); if (!sp) return false; S.level = 'ground'; S.px = sp.x; S.pz = sp.z; S.py = S.region.ground(sp.x, sp.z); useSpot(sp); return !!IA; },
      // свадебный двор (модуль VILLAGE.wedding, если есть)
      wedding: () => { const h = S.region; return h && h.places && h.places.wedding ? { module: !!h.wedding, gate: h.places.wedding.gate, npcs: h.npcs.filter(n => n.ext).length } : null; },
      // машина: выйти / сесть (drive.js волны 4)
      getOut: () => getOut(), getIn: () => getIn(),
      // волна 6: езда по селу — маршруты, QA-пилот, машина к точке стоянки, «сесть за руль» рядом с машиной
      routes: () => { const r = villageRoutes(); const o = {}; Object.keys(r).forEach(k => { o[k] = r[k].length; }); return o; },
      route: name => villageRoutes()[name] || null,
      simRoute: (name, o) => simRoute(name, o),
      carAt: name => { const h = S.region; if (!drv || !h || !h.drive) return null; const c = h.drive.carSpawns[name]; if (!c) return null; drv.teleport({ x: c.x, z: c.z, ry: c.ry }); if (chase) chase.snap(); if (S.mode === 'drive') { S.px = drv.S.x; S.pz = drv.S.z; S.py = drv.S.y; } return drv.info(); },
      heroToCar: () => { if (!drv) return false; const p = drv.doorPoint(1); S.mode = 'walk'; S.px = p.x; S.pz = p.z; S.py = S.region.ground(p.x, p.z); S.camInit = false; return drv.canEnter(S.px, S.pz); },
      drivable: (x, z) => { const h = S.region; return !!(h && h.drive && h.drive.drivable(x, z)); },
      teleportCar: (x, z, ry, sit) => { if (!drv) return null; drv.teleport({ x, z, ry: ry || 0 }); if (sit !== false && S.mode !== 'drive' && drv.heroIn && hero) { drv.heroIn(hero, { instant: true }); S.mode = 'drive'; document.body.classList.toggle('drive', true); } if (chase) chase.snap(); S.view = null; S.px = drv.S.x; S.pz = drv.S.z; S.py = drv.S.y; return drv.info(); },
      bubbles: () => bubbles.map(b => b.el.textContent),
      lastUse: () => S.lastUse || null,
      // ---------- W4A ----------
      iaEvents: () => (S.iaEv || []).slice(),   // события слоя рук (take, bite, lid, splash, …) — для тестов и звука
      kaz: () => ({ mode: KAZ_MODE, ok: kazOk(), worn: kazWorn(), btn: $('kazBtn').style.display !== 'none' ? $('kazBtn').textContent : null, beretVisible: !!(hero && hero.beret ? hero.beret.visible : null), hidden: V.kaz && V.kaz.beretHidden ? V.kaz.beretHidden() : null }),
      kazOn: on => (on ? kazWear({ instant: true, say: false }) : kazRemove()),
      kazBtn: () => { $('kazBtn').click(); return kazWorn(); },
      car: () => ({ id: S.carId, kind: car ? (car.kind || 'coupe') : null, drv: drv ? drv.S.mode : null, cfg: drv ? { halfL: drv.cfg.halfL, halfW: drv.cfg.halfW } : null }),
      setCar: id => setCar(id),
      menu: () => { menu(); return true; },
      closeMenu: () => { closeMenu(); return true; },
      // свадьба: место (treat | dance | congrats), такт, итог танца, розыгрыш
      wed: () => { const W = S.region && S.region.wedding; return W ? { dance: !!(S.dance), danceActive: W.dance.active, last: S.lastDance || null, treats: S.treats || 0, treat: S.treat || null, prank: W.prankState, prankLog: (S.prankLog || []).slice(), lod: W.lod } : null; },
      wedSpot: id => { const sp = S.region.spots.find(s => s.id === id); if (!sp) return false; S.level = 'ground'; S.px = sp.x; S.pz = sp.z; S.py = S.region.ground(sp.x, sp.z); useSpot(sp); return true; },
      danceTap: () => danceTap(),
      danceAuto: on => { S.danceAuto = !!on; return S.danceAuto; },
      prank: () => { const W = S.region && S.region.wedding; return W ? W.prank() : null; },
      // зиплайн и мини-гольф (регион hotel)
      zip: () => { const h = S.region, sp = h.spots.find(q => q.id === 'zipline_start'); if (!sp) return false; S.level = 'top'; S.px = sp.x; S.pz = sp.z; S.py = h.ground(sp.x, sp.z); useSpot(sp); return true; },
      zipState: () => (S.zip && S.zip.state ? S.zip.state() : null), zipEvents: () => S.zipEv.slice(), zipResult: () => S.zipResult || null,
      skip: () => { if (S.zip && S.zip.skip) { S.zip.skip(); return true; } return false; },
      golfStart: () => { const sp = S.region.spots.find(q => q.id === 'golf_putt'); if (!sp) return false; S.px = sp.x; S.pz = sp.z; useSpot(sp); return !!S.golf; },
      golfShoot: (a, p) => golfShoot(a, p), golfState: () => (S.golf ? S.golf.G.state() : null), golfStop: () => stopGolf(), golfAngle: () => (S.golf ? S.golf.G.aimAngle() : null),
      heroAt: (x, z, ry, level) => { if (IA && IA.busy()) { try { IA.cancel(); } catch (e) { /* ok */ } } S.level = level || 'ground'; placeHero(x, z, ry, ry); S.view = null; S.sitting = null; return S.py; },
      cam: (pos, target, fov) => { if (!pos) { S.view = null; S.camInit = false; return true; } S.view = { id: 'probe', v: { pos, target, fov: fov || 50 }, t: 10, from: new T.Vector3(), fromLook: new T.Vector3(), smooth: false }; return true; },
      dn: () => (window.DayNight ? { hour: +DayNight.hour().toFixed(2), phase: DayNight.phase(), override: DayNight.override(), lamps: dn ? dn.lampsOn() : null, toggle: !!document.querySelector('.dn-toggle') && document.querySelector('.dn-toggle').style.display !== 'none' ? document.querySelector('.dn-toggle').textContent : null } : null),
      dnSet: v => { if (!window.DayNight) return null; DayNight.set(v, { persist: false, instant: true }); return DayNight.phase(); },
      dnClock: hr => { if (!window.DayNight) return null; DayNight.setClock(hr == null ? null : () => hr); if (S.dnToggle) S.dnToggle.refresh(); return DayNight.phase(); },
    };

    /* ---------- старт ---------- */
    (async () => {
      try { await Promise.race([document.fonts ? document.fonts.load('900 20px Nunito') : 0, new Promise(r => setTimeout(r, 1200))]); } catch (e) { /* ok */ }
      await makeHero();
      resize(); window.addEventListener('resize', resize);
      const want = Q.get('region'), rid = want && want !== 'kubachi' && haveRegion(want) ? want : 'kubachi';
      loadRegion(rid, Q.get('from') || 'start');
      if (Q.get('view')) setView(Q.get('view'), false);
      if (Q.get('climb')) startClimb(Q.get('climb') === 'top' ? 'top' : 'bottom');
      if (Q.get('look') && S.region.camera.looks && S.region.camera.looks[Q.get('look')]) startLook(Q.get('look'));
      if (dn && DayNight.mountToggle) {   // в режиме ?shot=1 кнопку прячет CSS (.shot .ui)
        try { S.dnToggle = DayNight.mountToggle($('ui'), { className: 'dnbtn', onSet: (to, line) => toast(line, 2400) }); } catch (e) { /* без кнопки */ } }
      if (Q.get('zip') === '1' && S.rid === 'hotel') setTimeout(() => window.__village.zip(), 600);
      if (Q.get('spot') && S.region.spots.find(q => q.id === Q.get('spot'))) setTimeout(() => window.__village.spot(Q.get('spot')), 400);
      $('load').classList.add('done'); setTimeout(() => { const l = $('load'); if (l) l.remove(); }, 600);
      window.__villageReady = true;
      requestAnimationFrame(tick);
    })();
  })();
